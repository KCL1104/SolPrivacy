[package]
name = "solprivacy"
version = "0.2.0"
edition = "2021"
description = "Privacy Orchestration Layer for Solana - All-in-one CLI for privacy development"
license = "MIT"
repository = "https://github.com/user/solprivacy-cli"
keywords = ["solana", "privacy", "zk", "cli", "token-2022"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
# CLI Framework
clap = { version = "4", features = ["derive", "env", "color"] }
tokio = { version = "1", features = ["full"] }

# Solana
solana-sdk = "3"
solana-client = "3"
solana-transaction-status = "3"
solana-commitment-config = "3"
solana-system-interface = "2"
solana-pubkey = "2"  # For light-client compatibility
spl-token-2022 = { version = "10", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", features = ["no-entrypoint"] }

# Privacy
# privacy-cash = "0.2"  # Disabled: wasmer 2.x incompatible with Rust 1.91+ (see issue rust-lang/rust#142612)

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio-util = "0.7"

# CLI UX
colored = "3"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"

# Template Engine
handlebars = "6"

# Config & Env
dotenvy = "0.15"
dirs = "5"

# Error Handling
thiserror = "2"
anyhow = "1"

# Security
zeroize = "1"

# Crypto (for ElGamal key generation)
curve25519-dalek = "4"
rand = "0.8"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }

# Key Encryption & Derivation
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = "2.0"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = "0.12"
rpassword = "7"

# Light Protocol ZK Compression
light-client = "0.18"
csv = "1.4.0"
clap_complete = "4.5.65"


[dev-dependencies]
assert_cmd = "2"
predicates = "3"
solana-sdk = "3"

[[bin]]
name = "solprivacy"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = false

# Config for 'dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Conditions for На)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target triples)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
